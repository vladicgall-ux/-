<!doctype html>
<html lang="ru">
<meta charset="utf-8">
<title>Обложка</title>
<style>
  @font-face { font-family: Unbounded; font-weight: 900;
    src: url("../fishing/public/fonts/Unbounded900.ttf") format("truetype"); }
  @font-face { font-family: Unbounded; font-weight: 700;
    src: url("../fishing/public/fonts/Unbounded700.ttf") format("truetype"); }

  :root {
    --bg-far: #040f13;
    --bg-near: #0b2730;
    --glow: #2f7d88;
    --gold: #f0b23c;
    --gold-light: #ffe1a6;
    --text: #f3f8f8;
    --muted: #9fb6bc;
    --reed: #040f13;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1920px; height: 768px; overflow: hidden; }

  /* With the emblem gone the name carries the whole frame, so it is
     centred and set large, and the light sits behind it rather than off
     to one side. */
  body {
    font-family: Unbounded, sans-serif;
    background:
      radial-gradient(64% 108% at 50% 44%, var(--glow) 0%, var(--bg-near) 44%, var(--bg-far) 82%),
      var(--bg-far);
    position: relative;
    display: grid; place-items: center;
  }
  svg.deco { position: absolute; inset: 0; width: 100%; height: 100%; }

  .words { position: relative; text-align: center; padding: 0 80px; margin-top: -26px; }
  .eyebrow {
    font-weight: 700; font-size: 27px; letter-spacing: .46em;
    color: var(--gold); text-transform: uppercase; margin-bottom: 28px;
    padding-left: .46em;
  }
  h1 {
    font-weight: 900; font-size: 152px; line-height: .92;
    letter-spacing: -.018em; color: var(--text);
    text-shadow: 0 12px 52px rgba(0,0,0,.7);
  }
  h1 .gold { color: var(--gold); }
  .rule {
    width: 260px; height: 3px; margin: 36px auto 30px;
    background: linear-gradient(90deg, transparent, var(--gold), transparent);
  }
  .where {
    font-weight: 700; font-size: 29px; letter-spacing: .15em;
    color: var(--gold-light); text-transform: uppercase;
  }
  .coords {
    margin-top: 16px; font-weight: 700; font-size: 19px;
    letter-spacing: .22em; color: var(--muted);
  }
</style>

<svg class="deco" viewBox="0 0 1920 768" preserveAspectRatio="none">
  <defs>
    <linearGradient id="wl" x1="0" x2="1">
      <stop offset="0"   stop-color="var(--glow)" stop-opacity="0"/>
      <stop offset=".5"  stop-color="var(--glow)" stop-opacity=".75"/>
      <stop offset="1"   stop-color="var(--glow)" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- the trace an echo sounder draws along the bottom -->
  <path d="M0 700 C 260 674, 470 726, 700 706 S 1140 654, 1350 690
           S 1700 718, 1920 694"
        fill="none" stroke="url(#wl)" stroke-width="3"/>
  <path d="M0 700 C 260 674, 470 726, 700 706 S 1140 654, 1350 690
           S 1700 718, 1920 694 L1920 768 L0 768 Z"
        fill="var(--glow)" opacity=".11"/>

  <!-- reeds on both shoulders, clear of the type -->
  <g stroke="var(--reed)" stroke-width="13" stroke-linecap="round">
    <path d="M104 768 C 96 630, 132 540, 114 462"/>
    <path d="M176 768 C 170 652, 198 570, 186 508"/>
    <path d="M44  768 C 34  664, 58  586, 48  540"/>
    <path d="M244 768 C 242 682, 262 616, 254 574"/>
    <path d="M1816 768 C 1824 630, 1788 540, 1806 462"/>
    <path d="M1744 768 C 1750 652, 1722 570, 1734 508"/>
    <path d="M1876 768 C 1886 664, 1862 586, 1872 540"/>
    <path d="M1676 768 C 1678 682, 1658 616, 1666 574"/>
  </g>
  <g fill="var(--reed)">
    <ellipse cx="114"  cy="450" rx="13" ry="38"/>
    <ellipse cx="186"  cy="496" rx="12" ry="32"/>
    <ellipse cx="48"   cy="528" rx="11" ry="28"/>
    <ellipse cx="254"  cy="562" rx="10" ry="24"/>
    <ellipse cx="1806" cy="450" rx="13" ry="38"/>
    <ellipse cx="1734" cy="496" rx="12" ry="32"/>
    <ellipse cx="1872" cy="528" rx="11" ry="28"/>
    <ellipse cx="1666" cy="562" rx="10" ry="24"/>
  </g>
</svg>

<div class="words">
  <div class="eyebrow">клуб рыболовов</div>
  <h1>ФЕРМЕР <span class="gold">УЕЛГИ</span></h1>
  <div class="rule"></div>
  <div class="where">Челябинская область · Кунашак · озеро Уелги</div>
  <div class="coords">55.790520, 61.611172</div>
</div>
</html>
