<!doctype html>
<html lang="ru">
<meta charset="utf-8">
<title>Обложка</title>
<style>
  @font-face { font-family: Unbounded; font-weight: 900;
    src: url("../fishing/public/fonts/Unbounded900.ttf") format("truetype"); }
  @font-face { font-family: Unbounded; font-weight: 700;
    src: url("../fishing/public/fonts/Unbounded700.ttf") format("truetype"); }

  :root {
    --bg-far: #03121a;
    --bg-near: #0a2b38;
    --glow: #2f8ea0;
    --gold: #f0b23c;
    --gold-light: #ffe1a6;
    --text: #f3f8f8;
    --muted: #9fb6bc;
    --reed: #03121a;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1920px; height: 768px; overflow: hidden; }
  body {
    font-family: Unbounded, sans-serif;
    background:
      radial-gradient(58% 116% at 24% 50%, var(--glow) 0%, var(--bg-near) 40%, var(--bg-far) 78%),
      var(--bg-far);
    position: relative;
    display: flex; align-items: center;
    padding: 0 130px; gap: 78px;
  }
  svg.deco { position: absolute; inset: 0; width: 100%; height: 100%; }

  /* The emblem arrives as a disc on white, so a circular mask is all it
     needs — the white corners fall outside it. */
  .mark {
    position: relative; flex: 0 0 auto;
    width: 404px; height: 404px; border-radius: 50%;
    box-shadow: 0 0 0 5px var(--gold), 0 0 0 14px rgba(0,0,0,.55),
                0 28px 78px rgba(0,0,0,.65);
    overflow: hidden;
  }
  .mark img {
    width: 122%; height: 122%; margin: -11%; object-fit: cover; display: block;
    filter: hue-rotate(-38deg) saturate(1.1);
  }

  .words { position: relative; }
  .eyebrow {
    font-weight: 700; font-size: 25px; letter-spacing: .4em;
    color: var(--gold); text-transform: uppercase; margin-bottom: 20px;
  }
  h1 {
    font-weight: 900; font-size: 112px; line-height: .94;
    letter-spacing: -.015em; color: var(--text);
    text-shadow: 0 10px 44px rgba(0,0,0,.6);
  }
  h1 .gold { color: var(--gold); }
  .rule {
    width: 740px; height: 3px; margin: 28px 0 24px;
    background: linear-gradient(90deg, var(--gold), transparent);
  }
  .where {
    font-weight: 700; font-size: 26px; letter-spacing: .13em;
    color: var(--gold-light); text-transform: uppercase;
  }
  .coords {
    margin-top: 13px; font-weight: 700; font-size: 18px;
    letter-spacing: .2em; color: var(--muted);
  }
</style>

<svg class="deco" viewBox="0 0 1920 768" preserveAspectRatio="none">
  <defs>
    <linearGradient id="wl" x1="0" x2="1">
      <stop offset="0"   stop-color="var(--glow)" stop-opacity="0"/>
      <stop offset=".4"  stop-color="var(--glow)" stop-opacity=".6"/>
      <stop offset="1"   stop-color="var(--glow)" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <path d="M0 690 C 300 664, 540 716, 840 696 S 1400 648, 1920 684"
        fill="none" stroke="url(#wl)" stroke-width="3"/>
  <path d="M0 690 C 300 664, 540 716, 840 696 S 1400 648, 1920 684 L1920 768 L0 768 Z"
        fill="var(--glow)" opacity=".1"/>
  <g stroke="var(--reed)" stroke-width="11" stroke-linecap="round">
    <path d="M1832 768 C 1840 652, 1812 580, 1826 520"/>
    <path d="M1770 768 C 1776 670, 1754 614, 1764 570"/>
    <path d="M1888 768 C 1894 684, 1876 630, 1884 594"/>
    <path d="M1702 768 C 1706 700, 1690 656, 1698 626"/>
  </g>
  <g fill="var(--reed)">
    <ellipse cx="1826" cy="508" rx="11" ry="32"/>
    <ellipse cx="1764" cy="560" rx="10" ry="27"/>
    <ellipse cx="1884" cy="586" rx="9"  ry="23"/>
    <ellipse cx="1698" cy="618" rx="8"  ry="19"/>
  </g>
</svg>

<div class="mark"><img src="logo.png" alt=""></div>

<div class="words">
  <div class="eyebrow">клуб охотников и рыболовов</div>
  <h1>ФЕРМЕР <span class="gold">УЕЛГИ</span></h1>
  <div class="rule"></div>
  <div class="where">Челябинская область · Кунашак · озеро Уелги</div>
  <div class="coords">55.790520, 61.611172</div>
</div>
</html>
