<!doctype html>
<html lang="ru">
<meta charset="utf-8">
<title>Обложка Б</title>
<style>
  @font-face { font-family: Unbounded; font-weight: 900;
    src: url("../fishing/public/fonts/Unbounded900.ttf") format("truetype"); }
  @font-face { font-family: Unbounded; font-weight: 700;
    src: url("../fishing/public/fonts/Unbounded700.ttf") format("truetype"); }

  :root {
    --bg: #050d10; --accent: #f0b23c; --accent-light: #ffe1a6;
    --water: #3d8c96; --text: #f3f8f8; --muted: #9fb6bc;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1920px; height: 768px; overflow: hidden; }
  body { background: var(--bg); font-family: Unbounded, sans-serif; position: relative; }

  /* Dawn: the sky cools upward, the sun sits on the waterline and throws a
     column of gold down the middle — which is where the type stands. */
  .sky {
    position: absolute; inset: 0;
    background:
      radial-gradient(52% 78% at 50% 62%, rgba(240,178,60,.42) 0%, rgba(240,178,60,.10) 42%, transparent 68%),
      linear-gradient(180deg, #04090c 0%, #071620 34%, #0d2d36 58%, #0a1f27 62%, #061217 100%);
  }
  svg { position: absolute; inset: 0; width: 100%; height: 100%; }

  .plate {
    position: absolute; left: 0; right: 0; top: 148px;
    text-align: center; padding: 0 60px;
  }
  .eyebrow {
    font-weight: 700; font-size: 24px; letter-spacing: .46em;
    color: var(--accent); text-transform: uppercase; margin-bottom: 26px;
  }
  h1 {
    font-weight: 900; font-size: 136px; line-height: .9;
    letter-spacing: -.015em; color: var(--text);
    text-shadow: 0 10px 54px rgba(0,0,0,.8);
  }
  h1 .gold { color: var(--accent); }
  .sub {
    margin-top: 34px; font-weight: 700; font-size: 26px;
    letter-spacing: .18em; color: var(--accent-light); text-transform: uppercase;
    text-shadow: 0 4px 24px rgba(0,0,0,.85);
  }
  .coords {
    margin-top: 14px; font-weight: 700; font-size: 18px;
    letter-spacing: .22em; color: var(--muted);
  }
</style>

<div class="sky"></div>

<svg viewBox="0 0 1920 768" preserveAspectRatio="none">
  <defs>
    <linearGradient id="sun" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffe1a6"/>
      <stop offset="1" stop-color="#f0b23c"/>
    </linearGradient>
    <linearGradient id="column" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0"   stop-color="#f0b23c" stop-opacity=".55"/>
      <stop offset="1"   stop-color="#f0b23c" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="deep" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0a1f27" stop-opacity=".2"/>
      <stop offset="1" stop-color="#03080a"/>
    </linearGradient>
  </defs>

  <!-- the sun, half drowned in the waterline at y=470 -->
  <circle cx="960" cy="566" r="62" fill="url(#sun)" opacity=".92"/>
  <rect x="0" y="566" width="1920" height="202" fill="url(#deep)"/>
  <!-- its column on the water -->
  <path d="M916 566 L1004 566 L1078 768 L842 768 Z" fill="url(#column)"/>

  <!-- ripples across the column -->
  <g stroke="#ffe1a6" stroke-linecap="round" opacity=".5">
    <path d="M898 604 h124" stroke-width="3"/>
    <path d="M880 644 h160" stroke-width="3"/>
    <path d="M858 686 h204" stroke-width="4"/>
    <path d="M836 726 h248" stroke-width="4"/>
    
  </g>
  <g stroke="#3d8c96" stroke-linecap="round" opacity=".33">
    <path d="M120 618 h300" stroke-width="3"/>
    <path d="M1500 618 h300" stroke-width="3"/>
    <path d="M250 668 h380" stroke-width="3"/>
    <path d="M1290 668 h380" stroke-width="3"/>
    <path d="M90 724 h470" stroke-width="4"/>
    <path d="M1360 724 h470" stroke-width="4"/>
  </g>

  <!-- reeds: a proper stand of them, left and right of the type -->
  <g stroke="#04090c" stroke-width="13" stroke-linecap="round">
    <path d="M110 768 C 100 606, 134 508, 116 648"/>
    <path d="M172 768 C 166 626, 192 546, 180 596"/>
    <path d="M52  768 C 42  650, 64  574, 54  624"/>
    <path d="M232 768 C 230 664, 248 600, 240 648"/>
    <path d="M1810 768 C 1820 606, 1786 508, 1804 648"/>
    <path d="M1748 768 C 1754 626, 1728 546, 1740 596"/>
    <path d="M1868 768 C 1878 650, 1856 574, 1866 624"/>
    <path d="M1688 768 C 1690 664, 1672 600, 1680 648"/>
  </g>
  <g fill="#04090c">
    <ellipse cx="116"  cy="548" rx="11" ry="26"/>
    <ellipse cx="180"  cy="590" rx="10" ry="23"/>
    <ellipse cx="54"   cy="618" rx="10" ry="21"/>
    <ellipse cx="240"  cy="642" rx="9"  ry="19"/>
    <ellipse cx="1804" cy="548" rx="11" ry="26"/>
    <ellipse cx="1740" cy="590" rx="10" ry="23"/>
    <ellipse cx="1866" cy="618" rx="10" ry="21"/>
    <ellipse cx="1680" cy="642" rx="9"  ry="19"/>
  </g>
</svg>

<div class="plate">
  <div class="eyebrow">клуб охотников и рыболовов</div>
  <h1>ФЕРМЕР <span class="gold">УЕЛГИ</span></h1>
  <div class="sub">Челябинская область · Кунашак · озеро Уелги</div>
  <div class="coords">55.790520, 61.611172</div>
</div>
</html>
