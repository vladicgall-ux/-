<!doctype html>
<html lang="ru">
<meta charset="utf-8">
<title>Аватар</title>
<style>
  @font-face { font-family: Unbounded; font-weight: 900;
    src: url("../fishing/public/fonts/Unbounded900.ttf") format("truetype"); }
  @font-face { font-family: Unbounded; font-weight: 700;
    src: url("../fishing/public/fonts/Unbounded700.ttf") format("truetype"); }

  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 800px; height: 800px; overflow: hidden; }
  body {
    font-family: Unbounded, sans-serif;
    background:
      radial-gradient(70% 70% at 50% 76%, #1d4a52 0%, #0d232b 46%, #050d10 82%);
    position: relative;
  }
  svg { position: absolute; inset: 0; width: 100%; height: 100%; }

  /* VK crops the avatar to a circle, so nothing that matters goes outside
     the inscribed circle — hence the generous side padding. */
  .stack {
    position: absolute; inset: 0;
    display: flex; flex-direction: column; align-items: center;
    justify-content: center; padding: 0 96px; text-align: center;
    gap: 6px;
  }
  .top {
    font-weight: 700; font-size: 52px; letter-spacing: .16em;
    color: #f3f8f8;
  }
  .big {
    font-weight: 900; font-size: 128px; letter-spacing: -.02em;
    color: #f0b23c; line-height: .96;
    text-shadow: 0 8px 34px rgba(0,0,0,.6);
  }
  .rule { width: 132px; height: 4px; background: #27454f; margin: 14px 0 12px; }
  .bottom {
    font-weight: 700; font-size: 27px; letter-spacing: .26em;
    color: #9fb6bc; text-transform: uppercase;
  }
</style>

<svg viewBox="0 0 800 800">
  <!-- a pike, turned into a mark: one body line, one fin, one eye -->
  <g transform="translate(400 224)" fill="#f0b23c" opacity=".92">
    <path d="M-150 0 C -104 -46, -40 -60, 16 -44 C 58 -32, 86 -12, 118 0
             C 86 12, 58 32, 16 44 C -40 60, -104 46, -150 0 Z"/>
    <path d="M118 0 L162 -34 L150 0 L162 34 Z"/>
    <path d="M-22 -46 L-2 -84 L34 -50 Z"/>
    <circle cx="-96" cy="-8" r="9" fill="#050d10"/>
  </g>
  <!-- the water it swims over, kept clear of the type below -->
  <g stroke="#3d8c96" stroke-linecap="round" opacity=".3" fill="none">
    <path d="M250 300 h130" stroke-width="5"/>
    <path d="M420 300 h130" stroke-width="5"/>
  </g>
</svg>

<div class="stack">
  <div style="height:150px"></div>
  <div class="top">ФЕРМЕР</div>
  <div class="big">УЕЛГИ</div>
  <div class="rule"></div>
  <div class="bottom">клуб рыболовов</div>
</div>
</html>
