<!doctype html>
<html lang="ru">
<meta charset="utf-8">
<title>Обложка — фирменная</title>
<style>
  @font-face { font-family: Unbounded; font-weight: 900;
    src: url("../fishing/public/fonts/Unbounded900.ttf") format("truetype"); }
  @font-face { font-family: Unbounded; font-weight: 700;
    src: url("../fishing/public/fonts/Unbounded700.ttf") format("truetype"); }

  /* Taken from the community's own emblem: the green of the disc and the
     gold of its lettering. Nothing else is introduced. */
  :root {
    --green-deep: #06240c;
    --green: #12481a;
    --green-lit: #2a7a2a;
    --gold: #f2c141;
    --gold-light: #ffe9a8;
    --gold-deep: #9a6f12;
    --text: #f4fbf2;
    --muted: #b7ceb0;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1920px; height: 768px; overflow: hidden; }
  body {
    font-family: Unbounded, sans-serif;
    background:
      radial-gradient(64% 120% at 22% 52%, var(--green-lit) 0%, var(--green) 38%, var(--green-deep) 76%),
      var(--green-deep);
    position: relative;
    display: flex; align-items: center;
    padding: 0 132px; gap: 84px;
  }

  svg.deco { position: absolute; inset: 0; width: 100%; height: 100%; }

  .mark {
    position: relative; flex: 0 0 auto;
    width: 396px; height: 396px; border-radius: 50%;
    box-shadow: 0 0 0 5px var(--gold), 0 0 0 13px rgba(6,36,12,.85),
                0 26px 72px rgba(0,0,0,.6);
    overflow: hidden;
  }
  .mark img { width: 100%; height: 100%; object-fit: cover; display: block; }

  .words { position: relative; }
  .eyebrow {
    font-weight: 700; font-size: 26px; letter-spacing: .4em;
    color: var(--gold); text-transform: uppercase; margin-bottom: 22px;
  }
  h1 {
    font-weight: 900; font-size: 116px; line-height: .92;
    letter-spacing: -.015em; color: var(--text);
    text-shadow: 0 10px 44px rgba(0,0,0,.65);
  }
  h1 .gold { color: var(--gold); }
  .rule {
    width: 100%; max-width: 760px; height: 3px; margin: 30px 0 26px;
    background: linear-gradient(90deg, var(--gold), rgba(242,193,65,0));
  }
  .where {
    font-weight: 700; font-size: 27px; letter-spacing: .13em;
    color: var(--gold-light); text-transform: uppercase;
  }
  .coords {
    margin-top: 14px; font-weight: 700; font-size: 19px;
    letter-spacing: .2em; color: var(--muted);
  }
</style>

<!-- Reeds and a waterline, in the emblem's own greens. -->
<svg class="deco" viewBox="0 0 1920 768" preserveAspectRatio="none">
  <defs>
    <linearGradient id="wl" x1="0" x2="1">
      <stop offset="0"   stop-color="#2a7a2a" stop-opacity="0"/>
      <stop offset=".35" stop-color="#2a7a2a" stop-opacity=".55"/>
      <stop offset="1"   stop-color="#2a7a2a" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <path d="M0 686 C 280 662, 520 712, 820 692 S 1380 646, 1920 680"
        fill="none" stroke="url(#wl)" stroke-width="3"/>
  <path d="M0 686 C 280 662, 520 712, 820 692 S 1380 646, 1920 680 L1920 768 L0 768 Z"
        fill="#2a7a2a" opacity=".08"/>
  <g stroke="#06240c" stroke-width="10" stroke-linecap="round" opacity=".9">
    <path d="M1836 768 C 1842 660, 1818 596, 1830 540"/>
    <path d="M1778 768 C 1782 676, 1764 624, 1772 584"/>
    <path d="M1890 768 C 1894 690, 1878 640, 1886 608"/>
  </g>
  <g fill="#06240c" opacity=".9">
    <ellipse cx="1830" cy="530" rx="10" ry="30"/>
    <ellipse cx="1772" cy="576" rx="9"  ry="25"/>
    <ellipse cx="1886" cy="600" rx="8"  ry="21"/>
  </g>
</svg>

<div class="mark"><img src="logo_big.jpg" alt=""></div>

<div class="words">
  <div class="eyebrow">клуб охотников и рыболовов</div>
  <h1>ФЕРМЕР <span class="gold">УЕЛГИ</span></h1>
  <div class="rule"></div>
  <div class="where">Челябинская область · Кунашак · озеро Уелги</div>
  <div class="coords">55.790520, 61.611172</div>
</div>
</html>
